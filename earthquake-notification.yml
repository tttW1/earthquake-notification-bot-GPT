name: Earthquake Notification Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

# seen_ids.jsonをリポジトリへコミットするために必要
permissions:
  contents: write

# 同時実行による履歴ファイルの競合・二重通知を抑制
concurrency:
  group: earthquake-notification-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Initialize notification history
        run: |
          if [ ! -f seen_ids.json ]; then
            printf '[]\n' > seen_ids.json
          fi

      - name: Run earthquake information program
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # Python処理が途中で失敗しても、それまでに保存した履歴をコミットする
      - name: Commit notification history
        if: always() && !cancelled()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_ids.json

          if git diff --cached --quiet; then
            echo "通知履歴に変更はありません"
          else
            git commit -m "Update earthquake notification history"
            git push
          fi
